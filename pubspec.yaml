name: study_flow
description: Un'app per studenti per tracciare lo studio con Pomodoro.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter


  
  # Libreria per il timer 
  sleek_circular_slider: ^2.0.1

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0

  # UI & Utility
  lucide_flutter: 0.554.0
  fl_chart: ^0.68.0
  table_calendar: ^3.1.2
  intl: ^0.19.0
  provider: ^6.1.2
  
  # Icone iOS (inutile ma si lamentava se non lo mettevo)
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true